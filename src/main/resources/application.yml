server:
  port: ${PORT:8080}

spring:
  application:
    name: task-manager
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/taskmanager}
      
jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437} # Default 256-bit secret for dev
  expiration: 86400000 # 1 day in ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.taskmanager: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
